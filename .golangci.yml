version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Listener).Close
        - os.Remove
    gosec:
      excludes:
        - G204 # tests run docker and the built binary with arguments they compose
        - G304 # reading the file the operator names is the point
        - G306
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: internal/testbroker/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
