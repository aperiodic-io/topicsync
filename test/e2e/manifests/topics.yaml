---
# the negative control: deleting it with the operator running deletes the Kafka topic
apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata: {name: e2e.deleteme, namespace: redpanda}
spec:
  overwriteTopicName: e2e.deleteme
  interval: 15m
  partitions: 1
  replicationFactor: 1
  cluster: {staticConfiguration: {kafka: {brokers: ["redpanda-0.redpanda.redpanda.svc.cluster.local:9092"]}}}
