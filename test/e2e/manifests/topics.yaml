# Topic resources as live-ingestion renders them for the Redpanda operator.
apiVersion: cluster.redpanda.com/v1alpha2
kind: Topic
metadata: {name: ohlcv.v1.e2e.1m, namespace: redpanda}
spec: &spec
  overwriteTopicName: ohlcv.v1.e2e.1m
  interval: 15m
  partitions: 1
  replicationFactor: 1
  additionalConfig: {cleanup.policy: "delete", retention.bytes: "40316198", segment.bytes: "16777216"}
  cluster: {staticConfiguration: {kafka: {brokers: ["redpanda-0.redpanda.redpanda.svc.cluster.local:9092"]}}}
---
apiVersion: cluster.redpanda.com/v1alpha2
