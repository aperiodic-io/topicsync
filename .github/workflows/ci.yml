name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
# a newer push to a pull request makes its running checks moot
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
env:
  GOFLAGS: -mod=readonly
  REDPANDA_CURRENT: docker.redpanda.com/redpandadata/redpanda:v26.1.6
  REDPANDA_NEXT: docker.redpanda.com/redpandadata/redpanda:v26.2.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: go mod tidy leaves nothing to change
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.11.4, args: "--build-tags integration,acceptance" }
      - name: shellcheck
        run: shellcheck scripts/*.sh test/e2e/*.sh
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... ./spec/... ./cmd/...
      # the logic packages are held to 90%: the kafka adapter and the broker helper are covered by the integration
      # and acceptance jobs instead
      - name: coverage gate
        run: |
          go tool cover -func=coverage.out | tee coverage.txt | tail -1
          for pkg in internal/apply internal/cli internal/metrics internal/plan internal/retire spec; do
            pct=$(go test -count=1 -cover ./$pkg/ | grep -oE '[0-9.]+% of statements' | cut -d% -f1)
            echo "$pkg: $pct%"
            awk -v p="$pct" -v n="$pkg" 'BEGIN { if (p < 90) { print n " coverage " p "% is under 90%"; exit 1 } }'
          done
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: "coverage.*" }

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -run '^$' -fuzz FuzzParse -fuzztime 90s ./spec/

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: redpanda-26.1, flavor: redpanda, image: "docker.redpanda.com/redpandadata/redpanda:v26.1.6", upgrade: true }
          - { name: redpanda-26.2, flavor: redpanda, image: "docker.redpanda.com/redpandadata/redpanda:v26.2.1" }
          - { name: kafka-4.1, flavor: kafka, image: "apache/kafka:4.1.0" }
          - { name: kafka-3.9, flavor: kafka, image: "apache/kafka:3.9.1" }
    name: integration (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: docker pull -q "${{ matrix.image }}"
      - run: go test -tags integration -count=1 -p 1 -timeout 30m -v ./test/integration/ 2>&1 | tee integration.log
        env:
          TOPICSYNC_IT_FLAVOR: ${{ matrix.flavor }}
          TOPICSYNC_IT_IMAGE: ${{ matrix.image }}
          TOPICSYNC_IT_UPGRADE_FROM: ${{ matrix.upgrade && env.REDPANDA_CURRENT || '' }}
          TOPICSYNC_IT_UPGRADE_TO: ${{ matrix.upgrade && env.REDPANDA_NEXT || '' }}
      - name: no test may be skipped but the ones of another broker
        run: |
          set -o pipefail
          if grep -E -- '--- SKIP' integration.log | grep -vE 'Redpanda only|TOPICSYNC_IT_UPGRADE'; then exit 1; fi
          if [ "${{ matrix.upgrade }}" = "true" ] && grep -q -- '--- SKIP: TestARedpandaUpgrade' integration.log; then exit 1; fi

  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [redpanda, kafka]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # the previous build: the pull request's base, the commit before a push to main, the tag before a release
      - name: build the previous topicsync
        id: prev
        run: |
          case "${{ github.event_name }}" in
            pull_request) ref="origin/${{ github.base_ref }}" ;;
            push) if [[ "${{ github.ref }}" == refs/tags/* ]]; then ref=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true); else ref=HEAD^; fi ;;
            *) ref=origin/main ;;
          esac
          if [ -n "$ref" ] && git cat-file -e "$ref:cmd/topicsync/main.go" 2>/dev/null; then
            git worktree add -q /tmp/prev "$ref"
            (cd /tmp/prev && go build -o /tmp/topicsync-prev ./cmd/topicsync)
            echo "bin=/tmp/topicsync-prev" >> "$GITHUB_OUTPUT"
            echo "previous build: $ref ($(git rev-parse --short "$ref"))"
          else
            echo "no previous build with topicsync at '$ref': the upgrade scenario is skipped"
          fi
      - run: go test -tags acceptance -count=1 -p 1 -timeout 30m -v ./test/acceptance/
        env:
          TOPICSYNC_IT_FLAVOR: ${{ matrix.flavor }}
          TOPICSYNC_PREVIOUS_BIN: ${{ steps.prev.outputs.bin }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: topicsync:ci
          build-args: VERSION=${{ github.sha }}
      - name: the image runs as a Job runs it, non-root and read-only
        run: |
          docker run --rm --read-only --user 65532 topicsync:ci version | grep -q "${{ github.sha }}"
          go test -tags acceptance -count=1 -run TestTheImageRuns -v ./test/acceptance/
        env: { TOPICSYNC_IMAGE: "topicsync:ci" }
      - run: docker save topicsync:ci -o /tmp/topicsync-image.tar
      - uses: actions/upload-artifact@v4
        with: { name: image, path: /tmp/topicsync-image.tar, retention-days: 3 }

  e2e-kind:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: /tmp }
      - run: docker load -i /tmp/topicsync-image.tar
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - run: ./test/e2e/kind.sh
        env: { TOPICSYNC_IMAGE: "topicsync:ci", REDPANDA_IMAGE: "${{ env.REDPANDA_CURRENT }}" }

  # main's and every tag's image, multi-arch, and a dispatched branch's (its commit only, for a staging test); only
  # after every test passed
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, unit, fuzz, integration, acceptance, image, e2e-kind]
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tags
        run: |
          img=ghcr.io/${{ github.repository }}
          tags="$img:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then tags="$tags,$img:${GITHUB_REF_NAME},$img:latest"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then tags="$tags,$img:main"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$([[ "${{ github.ref }}" == refs/tags/* ]] && echo "$GITHUB_REF_NAME" || echo "${{ github.sha }}")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: true
          sbom: true
      - name: release binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir dist
          for os_arch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${os_arch%/*} GOARCH=${os_arch#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/aperiodic-io/topicsync/internal/cli.Version=$GITHUB_REF_NAME" \
              -o "dist/topicsync-${os_arch%/*}-${os_arch#*/}" ./cmd/topicsync
          done
          (cd dist && sha256sum topicsync-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
